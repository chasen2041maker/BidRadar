# Alembic 配置：数据库迁移脚本放在哪、文件怎么命名、日志怎么打。
#
# 数据库地址不写在这里，而是和 API 进程一样从 BIDRADAR_DATABASE_URL 或 .env 读取（见 migrations/env.py），
# 这样密码不会进 git，迁移和应用也不会连到两个不同的库。
#
# 常用命令（在仓库根目录运行）：
#   uv run alembic upgrade head                                     升到最新版本
#   uv run alembic revision --autogenerate --rev-id 0002 -m "..."   按 tables.py 的改动生成新迁移
#   uv run alembic check                                            检查 tables.py 和迁移是否一致

[alembic]
script_location = %(here)s/migrations
# 让 migrations/env.py 能 import bidradar。
prepend_sys_path = .
path_separator = os
# 迁移文件名用"编号_说明"，按编号排序就是执行顺序。编号用 --rev-id 手动指定。
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
