name: Project memory checks

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  project-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      structure: ${{ steps.structure.outcome }}
      tests: ${{ steps.tests.outcome }}
      memory: ${{ steps.memory.outcome }}
      clean: ${{ steps.clean.outcome }}
      diff: ${{ steps.diff.outcome }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 保留现有固定版本
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested version
        run: |
          git rev-parse HEAD
          python3 --version
          date -u +%FT%TZ
      - name: Validate handoff structure
        id: structure
        run: python3 scripts/check_project_memory.py
      - name: Test governance tools
        id: tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check memory freshness and changed-task note
        id: memory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/refresh_project_memory.py --check
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/refresh_project_memory.py --check --base "$BASE_SHA"
          else
            echo "No before SHA: diff-note gate deferred to pull_request; freshness checked."
          fi
      - name: Ensure validation keeps checkout clean
        id: clean
        run: |
          STATUS="$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$STATUS"
          test -z "$STATUS"
      - name: Check committed whitespace
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Generate per-update memory snapshot
        if: always()
        shell: bash
        env:
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          MEMORY_OUTCOME: ${{ steps.memory.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: python3 scripts/refresh_project_memory.py --report | tee -a "$GITHUB_STEP_SUMMARY"

  publish-memory:
    # 分支/PR 只生成只读摘要；只有已进入 main 的代码能拿到固定页写权限。
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.project-memory.result != 'cancelled' }}
    needs: project-memory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: bidradar-main-memory-page
      cancel-in-progress: false
    steps:
      - name: Check out main event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update fixed memory page without writing main
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURE_OUTCOME: ${{ needs.project-memory.outputs.structure }}
          TESTS_OUTCOME: ${{ needs.project-memory.outputs.tests }}
          MEMORY_OUTCOME: ${{ needs.project-memory.outputs.memory }}
          CLEAN_OUTCOME: ${{ needs.project-memory.outputs.clean }}
          DIFF_OUTCOME: ${{ needs.project-memory.outputs.diff }}
        run: python3 -m scripts.publish_project_memory
